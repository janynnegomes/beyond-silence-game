<head>

<title>Além do Silêncio — Protótipo</title>
<style>
:root{--bg:#dff4ff;--panel:#f8fcff;--panel2:#e8f5fc;--ink:#183c57;--muted:#5c7890;--mint:#b2f276;--gold:#ffd65a;--line:#a8c9dc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}button[hidden]{display:none!important}
#app{height:100dvh;min-height:100%;width:100%;position:relative;overflow:hidden;background:#dff4ff}
#ui-root{display:contents}
#loadingScreen{position:fixed;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;transform:none;padding:24px;background:linear-gradient(160deg,#155f98,#062b50);color:#fff;text-align:center;border-radius:0;box-shadow:none}#loadingScreen[hidden]{display:none!important}#loadingScreen .loading-content{width:min(80vw,380px)}#loadingScreen img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 5px #001d3d88)}#loadingScreen p{margin:24px 0 0;color:#e4f7ff;font-size:clamp(16px,2vw,20px);font-weight:700}#loadingScreen .loading-track{height:10px;margin:18px auto 0;max-width:260px;overflow:hidden;border:1px solid #83d8ff;border-radius:999px;background:#09385f}#loadingProgress{display:block;width:0;height:100%;background:linear-gradient(90deg,#ffcb35,#fff399);transition:width .2s ease}@media(prefers-reduced-motion:reduce){#loadingProgress{transition:none}}
#rotateScreen{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(24px + env(safe-area-inset-left,0px));background:linear-gradient(160deg,#0b5187,#062b50);color:#fff;text-align:center;overflow:auto}
#rotateScreen .rotate-content{max-width:340px}#rotateScreen .rotate-icon{width:112px;height:112px;margin:0 auto 24px;display:grid;place-items:center;border:2px solid #86d9ff;border-radius:32px;background:#16699d;box-shadow:0 6px 0 #06375f}#rotateScreen svg{width:76px;height:76px}#rotateScreen h1{margin:0 0 12px;font-size:clamp(24px,7vw,32px);line-height:1.15}#rotateScreen p{margin:0;color:#d9f3ff;font-size:16px;line-height:1.5}#rotateScreen:focus{outline:none}
@media (orientation:portrait) and (max-width:767px){#app{position:fixed;top:0;left:0;width:100dvh;height:100dvw;min-height:0;transform:rotate(90deg) translateY(-100%);transform-origin:top left;overflow:hidden}#rotateScreen{display:none!important}}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#42aef4;touch-action:none}
#game canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:auto}
#topbar{position:absolute;z-index:4;top:env(safe-area-inset-top,0);left:0;right:0;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{font-size:11px;letter-spacing:.14em;font-weight:800;text-shadow:0 2px 8px #0008}.top-actions{display:flex;gap:8px;pointer-events:auto}
#topbar{filter:drop-shadow(0 2px 3px #17405a66)}
.iconbtn{background:#f5fbffeF;color:#17405d;border:2px solid #ffffff;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:850;box-shadow:0 3px 0 #19618a55}
#objective{position:absolute;z-index:3;top:64px;left:14px;right:14px;padding:10px 13px;border:2px solid #ffffff;background:#f5fbfff0;border-radius:18px;font-size:12px;color:#174a6c;backdrop-filter:blur(8px);box-shadow:0 4px 0 #16426333}
#controls{position:absolute;z-index:3;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0));height:116px;pointer-events:none}
#stickBase,#stickRightBase{position:absolute;bottom:2px;width:104px;height:104px;border-radius:50%;background:#203d5980;border:4px solid #ffffffdf;box-shadow:0 4px 0 #143856aa,inset 0 0 0 3px #ffffff40;pointer-events:auto;touch-action:none}#stickBase{left:14px}#stickRightBase{right:14px}
#stick,#stickRight{position:absolute;left:24px;top:24px;width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#fff,#c8e7f7);border:3px solid #ffffff;box-shadow:0 4px 12px #102c4677;transform:translate(0,0);pointer-events:none}.stick-label{position:absolute;left:50%;transform:translateX(-50%);bottom:-17px;color:#fff;font-size:9px;font-weight:900;text-shadow:0 2px 4px #000;white-space:nowrap}
#stickRightBase.action-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .08s ease,box-shadow .08s ease}
#stickRightBase.action-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #143856aa,inset 0 0 0 3px #ffffff40}
#stickRightBase .action-icon{width:42px;height:42px;color:#fff;filter:drop-shadow(0 2px 3px #102c4677);pointer-events:none}
#stickRightBase .stick-label{position:static;transform:none;bottom:auto}
#lookLabel{position:absolute;right:18px;bottom:12px;color:#fff9;font-size:10px;text-align:right;text-shadow:0 1px 5px #000;pointer-events:none}
#interact{position:absolute;right:22px;bottom:45px;width:76px;height:76px;border-radius:50%;background:linear-gradient(145deg,#c5ff83,#86dc48);color:#17425e;border:4px solid #fff;font-size:12px;font-weight:900;box-shadow:0 5px 0 #35794c,0 8px 18px #0004;pointer-events:auto;display:none}
#dialogue,#modal{position:absolute;z-index:8;inset:0;background:#17456870;display:none;align-items:flex-end;justify-content:center;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0));backdrop-filter:blur(3px)}
.dialog-card,.modal-card{width:100%;max-width:520px;background:#f8fcff;border:2px solid #ffffff;border-radius:4px;padding:18px;color:var(--ink);box-shadow:0 16px 50px #123c5b55;max-height:88%;overflow:auto}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#337d6a;font-weight:850}
h1,h2,p{margin-top:0}h1{font-size:30px;line-height:1.05;margin-bottom:10px}h2{font-size:21px;margin-bottom:10px}.dialog-card h2{margin-top:7px}
.bodycopy{font-size:14px;line-height:1.55;color:#36536a;margin-bottom:14px}
.choices{display:grid;gap:9px;margin-top:14px}
.choice{background:#e8f4fb;border:1px solid #b8d3e3;border-radius:16px;padding:13px;text-align:left;font-size:13px;line-height:1.35;color:#183c57}
.choice:active{transform:scale(.99);background:#d5ecf8}
.primary{background:var(--mint);color:#102438;border-radius:14px;padding:13px 16px;font-weight:850;width:100%;font-size:14px}
.secondary{background:#eaf5fb;border:1px solid #b5d0e0;border-radius:14px;padding:12px 14px;width:100%;font-size:13px;color:#214a66}
.row{display:flex;gap:9px}.row>*{flex:1}
.small{font-size:11px;color:#5c7890;line-height:1.45}
#toast{position:absolute;z-index:5;left:16px;right:16px;bottom:165px;background:#f5fbfff2;color:#1e4964;border:2px solid #ffffff;border-radius:16px;padding:12px 14px;font-size:12px;line-height:1.45;display:none;box-shadow:0 5px 16px #123c5b44}
#startScreen{position:absolute;z-index:7;inset:0;background:linear-gradient(180deg,#e58f9b66 0%,#28486455 40%,#17364cee 72%,#102640 100%),radial-gradient(ellipse at 50% 25%,#ffd28a,transparent 48%);display:flex;align-items:flex-end;padding:28px 22px calc(26px + env(safe-area-inset-bottom,0))}
.start-content{width:100%;max-width:500px;margin:auto}
.kicker{color:var(--mint);font-size:10px;letter-spacing:.2em;font-weight:900}
.subtitle{color:#d0dbea;font-size:15px;line-height:1.45;margin:0 0 22px}
.start-art{height:34vh;min-height:190px;max-height:310px;position:relative;margin:0 -4px 22px;overflow:hidden;border-radius:3px;border:3px solid #18354e;image-rendering:auto;background:linear-gradient(#31a8f2 0%,#b0eaff 48%,#a1e65d 49%,#43bf50 100%);border:2px solid #ffffffaa;box-shadow:0 10px 24px #08213e66}
.school{position:absolute;left:12%;right:12%;top:28%;height:44%;background:linear-gradient(90deg,#e47d3e,#f09a4d);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);box-shadow:0 8px 20px #17243a66}
.school:before{content:"";position:absolute;inset:16% 8%;background:repeating-linear-gradient(90deg,#37a6cd 0 13%,transparent 13% 19%)}
.sun{position:absolute;width:70px;height:70px;border-radius:50%;background:#ffe16a;right:14%;top:10%;box-shadow:0 0 50px #fff9}
.path{position:absolute;bottom:-15%;left:35%;width:30%;height:65%;background:#f2ce58;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.start-note{font-size:11px;color:#b8c5d8;margin-top:12px;text-align:center}
#helpBadge{position:absolute;z-index:4;left:14px;bottom:calc(145px + env(safe-area-inset-bottom,0));background:#101a2bd9;border:1px solid #ffffff35;border-radius:12px;padding:8px 10px;font-size:10px}
#progressbar{height:5px;background:#ffffff20;border-radius:99px;overflow:hidden;margin:10px 0 14px}
#progressfill{height:100%;width:0;background:var(--mint);transition:width .3s}

/* Apresentacao visual: storyboard, falas curtas e foco no personagem. */
#dialogue{align-items:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0));}
.dialog-card{padding:16px;max-height:90%;border-radius:24px;background:linear-gradient(155deg,#1c2d47,#142137);border:1px solid #ffffff30;}
.story-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.story-step{font-size:10px;font-weight:900;letter-spacing:.14em;color:#8ee0c1}
.story-dots{display:flex;gap:5px;align-items:center}
.story-dots i{display:block;width:6px;height:6px;border-radius:50%;background:#ffffff35}
.story-dots i.active{width:19px;border-radius:9px;background:#8ee0c1}
.story-visual{position:relative;height:178px;border-radius:19px;overflow:hidden;margin-bottom:14px;background:linear-gradient(180deg,#38a8ef 0%,#c4edff 52%,#8ae055 53%,#45bc4a 100%);border:2px solid #ffffff55}
.story-visual:before{content:"";position:absolute;left:8%;right:8%;bottom:30px;height:72px;background:linear-gradient(#f3a054 0 12%,#e17d42 13% 100%);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);opacity:.96}
.story-visual:after{content:"";position:absolute;left:0;right:0;bottom:25px;height:3px;background:#e1e8db88;transform:rotate(-2deg)}
.story-sun{position:absolute;right:13%;top:17px;width:39px;height:39px;border-radius:50%;background:#ffe16a;box-shadow:0 0 34px #fff7}
.story-ball{position:absolute;left:13%;bottom:30px;width:28px;height:28px;border:3px solid #f7f4e9;border-radius:50%;background:radial-gradient(circle at 50% 50%,#263b50 0 23%,transparent 25%);box-shadow:0 3px 6px #0005;z-index:2}
.story-ball:before,.story-ball:after{content:"";position:absolute;background:#263b50;border-radius:50%}
.story-ball:before{width:9px;height:9px;left:6px;top:1px}.story-ball:after{width:8px;height:8px;right:1px;bottom:3px}
.story-bench{position:absolute;left:50%;bottom:44px;width:116px;height:8px;transform:translateX(-50%);background:#684f40;border-radius:3px;box-shadow:0 12px 0 -2px #684f40;z-index:2}
.story-bench:before,.story-bench:after{content:"";position:absolute;top:5px;width:5px;height:28px;background:#4b3b34}
.story-bench:before{left:10px}.story-bench:after{right:10px}
.story-lucas{position:absolute;z-index:3;left:50%;bottom:50px;width:46px;height:78px;transform:translateX(-50%)}
.story-lucas .head{position:absolute;top:0;left:13px;width:22px;height:24px;border-radius:48% 48% 45% 45%;background:#d8a982;box-shadow:inset 0 6px 0 #302a2b}
.story-lucas .body{position:absolute;left:5px;top:22px;width:36px;height:40px;border-radius:12px 12px 5px 5px;background:#263f5a}
.story-lucas .leg{position:absolute;top:54px;width:17px;height:16px;border-radius:4px;background:#202d3b}
.story-lucas .leg.one{left:5px;transform:rotate(12deg)}.story-lucas .leg.two{right:5px;transform:rotate(-12deg)}
.story-scene-label{position:absolute;left:12px;top:11px;padding:6px 9px;border-radius:99px;background:#102438b8;color:#f4f7fb;font-size:9px;font-weight:900;letter-spacing:.1em}
.story-title{font-size:23px;line-height:1.05;margin:0 0 10px}
.story-track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.story-tile{min-width:0;background:#253a55;border:1px solid #ffffff17;border-radius:14px;padding:10px 8px 9px;text-align:center}
.story-tile .tile-icon{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 7px;border-radius:11px;background:#8ee0c11a;font-size:18px}
.story-tile strong{display:block;font-size:9px;letter-spacing:.09em;color:#8ee0c1;margin-bottom:4px}
.story-tile span{display:block;font-size:11px;line-height:1.2;color:#e5edf6}
.story-quote{display:flex;gap:10px;align-items:center;padding:11px 12px;background:#101a2b;border:1px solid #ffffff20;border-radius:15px;margin:12px 0}
.quote-mark{font-size:27px;line-height:1;color:#8ee0c1;font-weight:900}
.story-quote p{font-size:13px;line-height:1.3;margin:0;color:#f4f7fb}
.story-foot{font-size:10px;line-height:1.35;color:#b8c5d8;margin:8px 2px 12px}
.story-choices{display:grid;gap:8px;margin:12px 0}
.story-choice{display:flex;align-items:center;gap:11px;width:100%;min-height:61px;padding:10px 12px;border-radius:15px;background:#253a55;border:1px solid #526681;text-align:left}
.story-choice:active{transform:scale(.99);background:#34506e}
.choice-symbol{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border-radius:12px;background:#8ee0c11c;font-size:19px}
.choice-copy{display:block;min-width:0}.choice-copy strong{display:block;font-size:13px;margin-bottom:3px}.choice-copy small{display:block;font-size:11px;line-height:1.25;color:#bfccdc}
.feedback-hero{display:flex;align-items:center;gap:12px;margin:6px 0 14px;padding:13px;border-radius:16px;background:linear-gradient(100deg,#284a52,#243951);border:1px solid #8ee0c133}
.feedback-symbol{display:grid;place-items:center;flex:0 0 45px;height:45px;border-radius:14px;background:#8ee0c126;color:#8ee0c1;font-size:25px}
.feedback-hero strong{display:block;font-size:15px}.feedback-hero span{display:block;font-size:11px;color:#c5d4e2;margin-top:3px}
.learning-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border-radius:99px;background:#8ee0c119;color:#b8f1dc;font-size:10px;font-weight:800;margin:2px 3px 2px 0}
.support-note{display:flex;align-items:flex-start;gap:10px;margin:10px 0;padding:11px 12px;border-radius:15px;background:#20374a;border:1px solid #8ee0c133}
.support-icon{display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border-radius:10px;background:#8ee0c11a;font-size:17px}
.support-note strong{display:block;font-size:9px;letter-spacing:.1em;color:#8ee0c1;margin:1px 0 4px}
.support-note p{font-size:11px;line-height:1.35;color:#e1eaf2;margin:0}
.badge-unlock{position:relative;display:flex;align-items:center;gap:12px;padding:10px 13px;margin:8px 0 13px;border-radius:17px;background:linear-gradient(105deg,#fff2b8,#ffdb70 58%,#ffefb0);border:2px solid #fff;color:#49370d;box-shadow:0 5px 0 #c58c30,0 8px 18px #0003;overflow:hidden;animation:badge-panel-in .55s cubic-bezier(.2,.85,.25,1.18) both}
.badge-medal{position:relative;display:grid;place-items:center;flex:0 0 52px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fff8b1 0 9%,#ffc92e 10% 43%,#e78d17 44% 68%,#b96013 69%);border:3px solid #fff5bf;box-shadow:0 2px 0 #ad671d,inset 0 0 0 2px #e89d1b;animation:medal-drop .85s cubic-bezier(.16,.82,.24,1.35) both}
.badge-medal:before,.badge-medal:after{content:"";position:absolute;z-index:-1;top:35px;width:14px;height:21px;background:linear-gradient(#ee4a50,#bb2738);clip-path:polygon(0 0,100% 0,82% 100%,50% 78%,18% 100%)}
.badge-medal:before{left:5px;transform:rotate(12deg)}.badge-medal:after{right:5px;transform:rotate(-12deg);background:linear-gradient(#4aa9e7,#2674bf)}
.badge-medal span{color:#fff9c7;font-size:25px;text-shadow:0 2px 2px #a65210}
.badge-copy{display:block;min-width:0;flex:1}.badge-copy strong{display:block;font-size:9px;letter-spacing:.13em;color:#916012}.badge-copy b{display:block;font-size:15px;margin:2px 0}.badge-copy small{display:block;font-size:10px;color:#705322}
.badge-spark{position:absolute;right:12px;top:7px;color:#fff;font-size:24px;text-shadow:0 1px 6px #e79b18;animation:spark-twinkle 1s ease-in-out infinite alternate}
@keyframes medal-drop{0%{opacity:0;transform:translateY(-70px) rotate(-55deg) scale(.25)}65%{opacity:1;transform:translateY(4px) rotate(12deg) scale(1.18)}82%{transform:translateY(-3px) rotate(-5deg) scale(.96)}100%{transform:translateY(0) rotate(0) scale(1)}}
@keyframes badge-panel-in{0%{opacity:0;transform:translateY(-24px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spark-twinkle{from{opacity:.45;transform:scale(.75) rotate(-12deg)}to{opacity:1;transform:scale(1.1) rotate(15deg)}}
@media(prefers-reduced-motion:reduce){.badge-unlock,.badge-medal,.badge-spark{animation:none}}
.journal-badges{display:grid;gap:7px;margin:12px 0}
.journal-badge-copy{display:block}.journal-badge-copy small{display:block;color:var(--gold);font-size:8px;font-weight:900;letter-spacing:.12em}.journal-badge-copy strong{display:block;font-size:11px;margin-top:2px}
.completion-actions{margin-top:12px}
.journal-hero{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:linear-gradient(120deg,#284852,#243951);border:1px solid #8ee0c133;margin:12px 0}
.journal-book{display:grid;place-items:center;flex:0 0 54px;height:54px;border-radius:16px;background:#8ee0c122;font-size:29px;transform:rotate(-4deg)}
.journal-hero h2{font-size:19px;margin:4px 0 0}.journal-count{margin-left:auto;align-self:flex-start;padding:6px 8px;border-radius:99px;background:#101a2b80;color:#cceede;font-size:9px;font-weight:850;white-space:nowrap}
.journal-path{margin:10px 0 16px}.journal-path .story-tile{padding:9px 5px}.journal-path .story-tile strong{font-size:8px}.journal-path .story-tile span{font-size:10px}
.journal-section{display:flex;align-items:center;justify-content:space-between;margin:15px 2px 8px}.journal-section strong{font-size:12px}.journal-section span{font-size:9px;color:var(--muted)}
.journal-entry{margin:0 0 7px;border:1px solid #ffffff1c;border-radius:14px;background:#20314a;overflow:hidden}
.journal-entry summary{display:flex;align-items:center;gap:10px;padding:10px;cursor:pointer;list-style:none;min-height:58px}
.journal-entry summary::-webkit-details-marker{display:none}.journal-entry summary:focus-visible{outline:2px solid var(--mint);outline-offset:-3px;border-radius:14px}
.journal-entry-icon{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:12px;background:#8ee0c119;font-size:18px}
.journal-entry-copy{display:block;min-width:0;flex:1}.journal-entry-copy strong{display:block;font-size:11px}.journal-entry-copy small{display:block;color:#bfccdc;font-size:10px;line-height:1.25;margin-top:3px}
.journal-entry-toggle{display:grid;place-items:center;flex:0 0 24px;height:24px;border-radius:50%;background:#ffffff0d;color:var(--mint);font-size:15px}
.journal-entry-toggle:before{content:"+"}.journal-entry[open] .journal-entry-toggle:before{content:"−"}
.journal-entry-body{margin:0;padding:0 13px 12px 56px;color:#dce6f1;font-size:11px;line-height:1.45}
.journal-skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:8px 0 14px}
.journal-skill{display:flex;align-items:center;gap:8px;padding:9px;border-radius:13px;background:#21324b;border:1px solid #ffffff14}
.journal-skill-icon{font-size:17px}.journal-skill strong{display:block;font-size:10px}.journal-skill small{display:block;font-size:9px;color:#b8c5d8;margin-top:2px}
.journal-badge{display:flex;align-items:center;gap:9px;padding:10px 12px;margin:12px 0;border-radius:14px;background:#f3cf8517;border:1px solid #f3cf8540}
.journal-badge>span:first-child{font-size:22px}.journal-badge small{display:block;color:var(--gold);font-size:8px;font-weight:900;letter-spacing:.12em}.journal-badge strong{display:block;font-size:11px;margin-top:2px}
.journal-empty{display:grid;place-items:center;text-align:center;padding:16px;border-radius:14px;background:#20314a;color:#c7d5e5;font-size:11px;line-height:1.4}
/* Interface clara inspirada no cartão de conquista; mantém o cenário colorido em destaque. */

/* Mapa da jornada em tela cheia, responsivo a diferentes orientações. */
#startScreen{display:none;align-items:stretch;padding:0;overflow:hidden;background:#79bb38;color:#fff}
.journey-screen{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:100%;height:100%;isolation:isolate;background:linear-gradient(180deg,#8dd24c 0%,#65ae32 100%);overflow:hidden}
.journey-screen:before,.journey-screen:after{content:"";position:absolute;z-index:-1;pointer-events:none}
.journey-screen:before{inset:0;background:radial-gradient(ellipse at 15% 22%,#a5dc51 0 12%,transparent 13%),radial-gradient(ellipse at 76% 30%,#82c53b 0 17%,transparent 18%),radial-gradient(ellipse at 42% 78%,#8dcc3e 0 18%,transparent 19%),linear-gradient(180deg,#304d27 0 8%,transparent 8% 92%,#477432 92%)}
.journey-screen:after{width:26%;height:130%;right:-4%;top:-12%;background:#30b9d1;clip-path:polygon(55% 0,100% 0,100% 100%,20% 100%,46% 78%,35% 58%,68% 39%,48% 21%);opacity:.92;border-left:8px solid #64e4dd}
.journey-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(10px,2.5vh,22px) clamp(16px,4vw,54px);background:linear-gradient(100deg,#7614c6,#a000df 58%,#6b10b2);border-bottom:4px solid #4c1686;box-shadow:0 4px 0 #ffffff30;z-index:3}
.journey-title{font-size:clamp(16px,3vw,30px);font-weight:1000;letter-spacing:.035em;text-shadow:0 3px 0 #4d1788;white-space:nowrap}.journey-kicker{display:block;font-size:clamp(8px,1.2vw,12px);letter-spacing:.16em;opacity:.8;margin-bottom:2px}
.journey-progress-box{min-width:150px;max-width:34vw;display:flex;align-items:center;gap:10px;background:#43136fb0;border:2px solid #ffffff55;border-radius:5px;padding:7px 12px;font-weight:900;font-size:clamp(10px,1.7vw,16px)}
.journey-progress-icon{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;background:#f5d94f;color:#43286d;border:3px solid #fff3a3;font-size:18px;box-shadow:0 3px 0 #3d286b}
.journey-status{display:flex;align-items:center;justify-content:flex-end;gap:clamp(5px,1vw,12px);min-width:0}.journey-totals{display:flex;gap:clamp(5px,1vw,12px);align-items:center;font-size:clamp(9px,1.1vw,13px);font-weight:800;white-space:nowrap}.journey-total{display:flex;align-items:center;gap:4px}.journey-total-icon{font-size:1.3em}
@media(max-width:700px){.journey-top{gap:5px}.journey-title{font-size:clamp(12px,2.5vw,18px)}.journey-totals{gap:5px;font-size:9px}.journey-total{gap:2px}.journey-progress-box{font-size:9px}.journey-progress-icon{width:24px;height:24px}}
.journey-track{position:relative;min-height:0;overflow:hidden}
.journey-terrain{position:absolute;width:100%;height:100%;inset:0}
.journey-river{fill:none;stroke:#168bb5;stroke-width:42;stroke-linecap:round;opacity:.86}.journey-river-light{fill:none;stroke:#53d9dd;stroke-width:5;stroke-linecap:round;stroke-dasharray:20 18;opacity:.8}
.journey-road-shadow{fill:none;stroke:#74852e;stroke-width:50;stroke-linecap:round;stroke-linejoin:round;opacity:.7}.journey-road{fill:none;stroke:#f0cd68;stroke-width:40;stroke-linecap:round;stroke-linejoin:round}
.journey-decor{position:absolute;font-size:clamp(22px,5vh,48px);filter:drop-shadow(0 3px 0 #38682d);user-select:none}.journey-decor.tree{font-size:clamp(23px,5.5vh,54px)}.jd1{left:4%;top:12%}.jd2{left:19%;top:56%}.jd3{left:37%;top:18%}.jd4{left:55%;top:65%}.jd5{left:72%;top:10%}.jd6{left:87%;top:48%}.journey-school{position:absolute;right:4%;top:4%;width:clamp(78px,14vw,170px);height:clamp(48px,12vh,105px);background:#bd7041;border:4px solid #71442d;box-shadow:0 8px 0 #52792c;clip-path:polygon(0 30%,48% 0,100% 30%,100% 100%,0 100%)}.journey-school:before{content:"";position:absolute;inset:40% 15% 0;background:repeating-linear-gradient(90deg,#76d0d2 0 20%,#bd7041 20% 28%)}.journey-school:after{content:"BIBLIOTECA";position:absolute;left:0;right:0;top:31%;text-align:center;font-size:clamp(7px,1.2vh,11px);font-weight:1000;color:white;text-shadow:0 1px #633a28}
.journey-stops{position:absolute;inset:0;margin:0;padding:0;list-style:none}.journey-stop{position:absolute;display:flex;align-items:center;gap:8px;transform:translate(-50%,-50%);max-width:24vw}.journey-stop:nth-child(1){left:9%;top:78%}.journey-stop:nth-child(2){left:23%;top:38%}.journey-stop:nth-child(3){left:38%;top:76%}.journey-stop:nth-child(4){left:51%;top:32%}.journey-stop:nth-child(5){left:66%;top:76%}.journey-stop:nth-child(6){left:79%;top:38%}.journey-stop:nth-child(7){left:90%;top:78%;flex-direction:row-reverse}.journey-stop:nth-child(7) .journey-stop-copy{text-align:right}
.journey-node{position:relative;display:grid;place-items:center;flex:none;width:clamp(36px,7vh,64px);height:clamp(36px,7vh,64px);border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff 0 12%,#ece8f5 13% 58%,#aaa7b2 59% 68%,#4c4856 69%);border:3px solid #4b4658;box-shadow:0 4px 0 #263d2b,0 0 0 3px #ffffff85;color:#312455;font-size:clamp(16px,3vh,27px);font-weight:1000;text-shadow:0 1px #fff;transition:transform .2s,filter .2s}
.journey-stop-copy{display:flex;flex-direction:column;gap:2px;padding:6px 9px;background:#24442edb;border:1px solid #ffffff65;border-radius:4px;box-shadow:0 3px 0 #42682b;min-width:90px}.journey-stop-copy strong{font-size:clamp(8px,1.45vh,13px);line-height:1.05;white-space:nowrap}.journey-stop-copy small{font-size:clamp(7px,1.2vh,11px);color:#e1f3d1;white-space:nowrap}.journey-stop-copy em{display:none;font-size:8px;font-style:normal;font-weight:1000;letter-spacing:.08em;color:#ffe77a}
.journey-stop:nth-child(4),.journey-stop:nth-child(6){flex-direction:row-reverse}.journey-stop:nth-child(4) .journey-stop-copy,.journey-stop:nth-child(6) .journey-stop-copy{text-align:right}.journey-stop:nth-child(5){flex-direction:column-reverse}.journey-stop:nth-child(5) .journey-stop-copy{text-align:center}
.journey-stop.is-current .journey-node{background:radial-gradient(circle at 35% 28%,#fff 0 12%,#f3e47d 13% 58%,#d7a928 59% 68%,#874ca7 69%);border-color:#6625a0;box-shadow:0 4px 0 #4d286a,0 0 0 4px #d9a9ff;transform:scale(1.14)}.journey-stop.is-current .journey-stop-copy{background:#7618c9ed;border-color:#ffef9b}.journey-stop.is-current em{display:block}.journey-stop.is-done .journey-node{background:radial-gradient(circle at 35% 28%,#fff 0 12%,#c5f074 13% 58%,#68b944 59% 68%,#3d753c 69%);color:#234a2d}.journey-stop.is-done .journey-stop-copy em{display:block;color:#b8f879}.journey-stop.is-locked{filter:saturate(.65);opacity:.87}
.journey-stop.is-replayable{cursor:pointer}.journey-stop.is-replayable .journey-node{box-shadow:0 4px 0 #263d2b,0 0 0 3px #ffffff85,0 0 0 6px #b8f87970}.journey-stop.is-replayable:hover .journey-node,.journey-stop.is-replayable:focus-visible .journey-node{transform:scale(1.13);filter:brightness(1.08)}.journey-stop.is-replayable:focus-visible{outline:3px solid #fff49a;outline-offset:6px;border-radius:10px}.journey-stop.is-done .journey-stop-copy em{display:none}
.journey-bottom{z-index:3;display:flex;align-items:center;justify-content:center;gap:10px;padding:clamp(7px,1.8vh,16px) max(14px,env(safe-area-inset-left,0px)) calc(clamp(7px,1.8vh,16px) + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,#7612bb,#9a0cda,#7412bb);border-top:4px solid #58188d;box-shadow:0 -4px 0 #ffffff30}.journey-bottom .primary,.journey-bottom .secondary{width:auto;min-width:min(220px,42vw);padding:10px 20px;font-size:clamp(11px,1.8vw,16px)}.journey-bottom .primary{background:#ffe66b;color:#3a2860;border-color:#f7ffa4;box-shadow:0 4px 0 #4d286a}.journey-bottom .secondary{background:#5e1d8e;color:#fff;border-color:#e2b1ff;box-shadow:0 4px 0 #421a68}.journey-note{position:absolute;left:12px;bottom:calc(100% + 4px);padding:4px 7px;background:#25432dd9;border-radius:3px;color:#fff;font-size:clamp(7px,1.1vh,10px)}
@media(max-width:640px){.journey-top{padding:8px 10px;gap:8px}.journey-progress-box{min-width:auto;padding:5px 7px;gap:6px}.journey-progress-icon{width:28px;height:28px;font-size:14px}.journey-stop-copy{padding:4px 6px;min-width:0}.journey-stop{gap:5px}.journey-stop:nth-child(1){left:8%;top:80%}.journey-stop:nth-child(2){left:26%;top:58%}.journey-stop:nth-child(3){left:43%;top:34%}.journey-stop:nth-child(4){left:60%;top:59%}.journey-stop:nth-child(5){left:77%;top:34%}.journey-stop:nth-child(6){left:87%;top:75%}.journey-stop-copy small{display:none}.journey-stop-copy strong{white-space:normal;max-width:68px}.journey-school{right:2%}}

/* Os falantes recebem balões no cenário; só a área de pergunta e escolhas recebe cliques. */
#dialogue{z-index:6;inset:0;padding:0;background:transparent;backdrop-filter:none;display:none;pointer-events:none}
/* O modal é sempre a camada superior: #learningScroll.is-summary usa z-index:20
   e, sem isto, um modal aberto durante o diálogo ficaria escondido atrás do
   painel de conhecimento (que ainda assim seria inert, bloqueando cliques). */
#modal{z-index:30}
#dialogue.character-conversation{display:block}
#dialogueCard.character-bubble{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);width:min(290px,38vw);max-height:min(44vh,390px);overflow:auto;padding:0;background:transparent;color:#183c57;border:0;box-shadow:none;pointer-events:auto;overscroll-behavior:contain}
#dialogueCard.character-bubble.voice-busy{pointer-events:none}
#dialogueCard.character-bubble:after{display:none}
#dialogueCard.character-bubble .story-head,#dialogueCard.character-bubble .story-visual,#dialogueCard.character-bubble .story-track:not(.journal-path),#dialogueCard.character-bubble .story-foot{display:none!important}
#dialogueCard.character-bubble .story-title{font-size:14px;line-height:1.2;margin:0 0 6px;color:#34734d}
#dialogueCard.character-bubble .story-quote{position:relative;display:block;width:fit-content;max-width:92%;margin:8px 0 10px;padding:8px 11px;background:#e7f6fc;color:#183c57;border:2px solid #8bc8d7;border-radius:12px 12px 12px 4px;box-shadow:0 3px 0 #c3e3eb}
#dialogueCard.character-bubble .story-quote:after{content:"";position:absolute;left:12px;bottom:-7px;width:10px;height:10px;background:#e7f6fc;border-right:2px solid #8bc8d7;border-bottom:2px solid #8bc8d7;transform:rotate(45deg)}
